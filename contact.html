  </head>
  <body>
    <canvas id="bg"> </canvas>
    <nav class="navbar navbar-expand-lg navbar-dark justify-content-center">
      <div class="container justify-content-center">
        <button
          aria-controls="navbarSupportedContent6"
          aria-expanded="false"
          aria-label="Toggle navigation"
          class="navbar-toggler"
          data-bs-target="#navbarSupportedContent6"
          data-bs-toggle="collapse"
          type="button"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div
          class="collapse navbar-collapse justify-content-center"
          id="navbarSupportedContent6"
        >
          <ul class="navbar-nav me-auto my-2 my-lg-0 justify-content-center">
            <li class="nav-item me-4">
              <a class="nav-link magic-hover magic-hover__square" href="/"
                ><h3>Home</h3></a
              >
            </li>
            <li class="nav-item me-4">
              <a

            <li class="nav-item me-4">
              <a
                class="nav-link magic-hover magic-hover__square"

                ><h3>Contact</h3></a

        </div>

    <main>
      <section class="contact">
        <div class="form-container">
          <h3 id="Contact-Me">Contact Me</h3>
          <!-- form fields -->
          <form name="contact" id="contact-form">
            <input type="hidden" name="contact_number" />
            <input
              type="text"
              class="form-control form-control-lg"
              placeholder="Name"
              name="user_name"
            />
            <input
              type="email"
              class="form-control mt-3"
              placeholder="Email"
              name="user_email"
            />
            <div class="mb-3 mt-3">
              <textarea
                class="form-control"
                rows="5"
                id="comment"
                name="message"
                placeholder="Message"
              ></textarea>
            </div>
            <button type="submit" class="btn btn-outline-primary" value="Send">
              Send
            </button>
          </form>
        </div>
      </section>
      <footer>
        <div class="icon-wrapper">
          <a href="https://github.com/Shaven-Wickramanayaka" target="_blank">
            <i class="fa-brands fa-github magic-hover magic-hover__square"></i
          ></a>
          <a
            href="https://www.linkedin.com/in/shavenwickramanayaka/"
            target="_blank"
          >
            <i
              class="fa-brands fa-linkedin magic-hover magic-hover__square"
            ></i>
          </a>
          <a
            href="https://www.instagram.com/shavenwickramanayaka/"
            target="_blank"
          >
            <i
              class="fa-brands fa-square-instagram magic-hover magic-hover__square"
            ></i>
          </a>
        </div>
      </footer>
    </main>
    <script
      type="text/javascript"
      src="https://res.cloudinary.com/veseylab/raw/upload/v1684982764/magicmouse-2.0.0.cdn.min.js"
    ></script>
    <script type="text/javascript">
      options = {
        cursorOuter: "circle",
        hoverEffect: "circle-move",
        hoverItemMove: false,
        defaultCursor: false,
        outerWidth: 30,
        outerHeight: 30,
      };
      magicMouse(options);
    </script>
  </body>
</html>
