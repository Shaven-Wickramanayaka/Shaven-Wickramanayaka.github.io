    <main>
      <section class="contact">
        <div class="form-container">
          <h3 id="Contact-Me">Contact Me</h3>
          <!-- form fields -->
          <form name="contact" id="contact-form">
            <input type="hidden" name="contact_number" />
            <input
              type="text"
              class="form-control form-control-lg"
              placeholder="Name"
              name="user_name"
            />
            <input
              type="email"
              class="form-control mt-3"
              placeholder="Email"
              name="user_email"
            />
            <div class="mb-3 mt-3">
              <textarea
                class="form-control"
                rows="5"
                id="comment"
                name="message"
                placeholder="Message"
              ></textarea>
            </div>
            <button
              class="fs-btn-orange-black-rounded-outlined"
              aria-label="Download CV"
              type="submit"
              value="Send"
            >
              <h3>Send Email</h3>
            </button>
          </form>
        </div>

    <script
      type="text/javascript"
      src="https://res.cloudinary.com/veseylab/raw/upload/v1684982764/magicmouse-2.0.0.cdn.min.js"
    ></script>

    <script type="text/javascript">
      window.onload = function () {
        const form = document.getElementById("contact-form");
        const submitButton = form.querySelector('button[type="submit"]');
        let emailSent = false;

        form.addEventListener("submit", function (event) {
          event.preventDefault();

          // Prevent multiple submissions
          if (emailSent) {
            alert("You have already sent an email.");
            return;
          }

          // Disable button during submission
          submitButton.disabled = true;
          submitButton.textContent = "Sending...";

          emailjs.sendForm("contact_service", "contact_form", this).then(
            () => {
              console.log("SUCCESS!");
              alert("Email Sent Successfully");
              emailSent = true;
              submitButton.textContent = "Sent";
              // Keep button disabled after successful send
            },
            (error) => {
              console.log("FAILED...", error);
              alert("Email failed, try reloading the page");
              // Re-enable button on failure
              submitButton.disabled = false;
              submitButton.textContent = "Send";
            },
          );
        });
      };
    </script>
    <script type="text/javascript">
      options = {
        hoverEffect: "circle-move",
        hoverItemMove: false,
        defaultCursor: false,
        outerWidth: 30,
        outerHeight: 30,
      };
      magicMouse(options);
    </script>
